name: Morning Report

on:
  schedule:
    - cron: "0 0 * * *"   # 7:00 Asia/Bangkok
  workflow_dispatch:        # manual trigger

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Run morning report

        env:
          TELEGRAM_BOT_TOKEN: ${{8901830717:AAGUcfPQ4cSmUGVbbOH9_vzK2gY5bNr99pg}}
          TELEGRAM_CHAT_ID:   ${{6986907246}}
          GOOGLE_SHEETS_ID:   ${{https://docs.google.com/spreadsheets/d/13FAjNsLgNrXqfsgfKb5zUP5o-gy068R35EhMvhQ_A8c/edit?usp=sharing}}
        run: python morning_report.py
